<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="100%" height="100%">
  <defs>
    <!-- Gradientes de Fundo e Ambiente -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gradientes de Aço e Molde -->
    <linearGradient id="steelPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="steelDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="goldPin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Gradiente do Protetor de Molde (Tapete Emborrachado Verde Técnico) -->
    <linearGradient id="rubberMat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Gradiente da Tela do Notebook -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031024" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- Gradiente da Bancada de Trabalho -->
    <linearGradient id="benchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="20%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Brilho Neon e Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fundo da Ferramentaria / Ambiente Industrial -->
  <rect width="760" height="540" rx="16" fill="url(#bgGrad)" />

  <!-- Grade Técnica no Fundo (Blueprint Grid) -->
  <g opacity="0.12">
    <path d="M0 40 H760 M0 80 H760 M0 120 H760 M0 160 H760 M0 200 H760 M0 240 H760 M0 280 H760" stroke="#38bdf8" stroke-width="1" />
    <path d="M40 0 V340 M80 0 V340 M120 0 V340 M160 0 V340 M200 0 V340 M240 0 V340 M280 0 V340 M320 0 V340 M360 0 V340 M400 0 V340 M440 0 V340 M480 0 V340 M520 0 V340 M560 0 V340 M600 0 V340 M640 0 V340 M680 0 V340 M720 0 V340" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Iluminação Superior de Oficina CNC (Lâmpada LED Industrial) -->
  <polygon points="380,0 260,200 500,200" fill="#38bdf8" opacity="0.04" />
  <rect x="290" y="8" width="180" height="6" rx="3" fill="#e2e8f0" opacity="0.8" />

  <!-- ==================== BANCADA DE FERRAMENTARIA ==================== -->
  <g id="workbench">
    <!-- Tampo da Bancada de Trabalho -->
    <polygon points="20,330 740,330 710,510 50,510" fill="url(#benchGrad)" stroke="#475569" stroke-width="2" />
    <!-- Borda frontal chanfrada com escala métrica milimetrada -->
    <polygon points="50,510 710,510 710,528 50,528" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <g opacity="0.4" stroke="#94a3b8" stroke-width="1">
      <path d="M70 510 v10 M90 510 v6 M110 510 v10 M130 510 v6 M150 510 v10 M170 510 v6 M190 510 v10 M210 510 v6 M230 510 v10 M250 510 v6 M270 510 v10 M290 510 v6 M310 510 v10 M330 510 v6 M350 510 v10 M370 510 v6 M390 510 v10 M410 510 v6 M430 510 v10 M450 510 v6 M470 510 v10 M490 510 v6 M510 510 v10 M530 510 v6 M550 510 v10 M570 510 v6 M590 510 v10 M610 510 v6 M630 510 v10 M650 510 v6 M670 510 v10 M690 510 v10" />
    </g>
  </g>

  <!-- ==================== PROTETOR DE MOLDE EMBAIXO ==================== -->
  <g id="mold_protector_mat">
    <!-- Tapete de borracha verde industrial sob o molde (protege matriz de riscos) -->
    <polygon points="175,340 485,340 470,490 155,490" fill="url(#rubberMat)" stroke="#10b981" stroke-width="2" filter="url(#cardShadow)" />
    <!-- Textura antiderrapante do protetor -->
    <g opacity="0.25" stroke="#34d399" stroke-width="1.5">
      <line x1="200" y1="350" x2="175" y2="480" />
      <line x1="250" y1="350" x2="225" y2="480" />
      <line x1="300" y1="350" x2="275" y2="480" />
      <line x1="350" y1="350" x2="325" y2="480" />
      <line x1="400" y1="350" x2="375" y2="480" />
      <line x1="450" y1="350" x2="425" y2="480" />
    </g>
    <!-- Etiqueta do Protetor -->
    <rect x="170" y="472" width="115" height="13" rx="3" fill="#064e3b" stroke="#34d399" stroke-width="0.8" />
    <text x="227" y="482" fill="#a7f3d0" font-family="monospace" font-size="7" font-weight="bold" text-anchor="middle">PROTETOR DE MATRIZ</text>
  </g>

  <!-- ==================== MOLDE DE INJEÇÃO SOBRE A MESA ==================== -->
  <g id="injection_mold">
    <!-- Base de Fixação Inferior (Placa Base do Molde) -->
    <polygon points="205,355 455,355 445,465 190,465" fill="url(#steelDark)" stroke="#64748b" stroke-width="1.5" />
    <!-- Bloco Central de Cavidades Usinadas em Aço Nobre (P20 / H13) -->
    <polygon points="215,350 445,350 435,445 200,445" fill="url(#steelPlate)" stroke="#94a3b8" stroke-width="2" />

    <!-- 4 Colunas Guias de Precisão com Dourado Tratado (Guide Pins) -->
    <rect x="222" y="338" width="12" height="18" rx="2" fill="url(#goldPin)" stroke="#78350f" stroke-width="1" />
    <rect x="424" y="338" width="12" height="18" rx="2" fill="url(#goldPin)" stroke="#78350f" stroke-width="1" />
    <rect x="208" y="430" width="14" height="20" rx="2" fill="url(#goldPin)" stroke="#78350f" stroke-width="1" />
    <rect x="415" y="430" width="14" height="20" rx="2" fill="url(#goldPin)" stroke="#78350f" stroke-width="1" />

    <!-- Cavidades do Molde (2 Cavidades Técnicas de Peça Plástica Usinadas) -->
    <rect x="245" y="365" width="75" height="60" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="282" cy="395" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M272 395 h20 M282 385 v20" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />

    <rect x="335" y="365" width="75" height="60" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="372" cy="395" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M362 395 h20 M372 385 v20" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Canais de Refrigeração e Bicos de Injeção Laterais -->
    <circle cx="210" cy="390" r="5" fill="#ef4444" stroke="#991b1b" stroke-width="1" />
    <circle cx="210" cy="410" r="5" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1" />
    <circle cx="440" cy="390" r="5" fill="#ef4444" stroke="#991b1b" stroke-width="1" />
    <circle cx="440" cy="410" r="5" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1" />
  </g>

  <!-- ==================== APARELHO DE MEDIÇÃO SOBRE O MOLDE ==================== -->
  <g id="measuring_device">
    <!-- Base Magnética Articulada Fixa no Molde -->
    <rect x="295" y="380" width="22" height="18" rx="3" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="306" cy="389" r="4" fill="#0284c7" />

    <!-- Haste Articulada de Aço Inox (Relógio Comparador / Sonda CMM) -->
    <line x1="306" y1="380" x2="318" y2="330" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
    <circle cx="318" cy="330" r="5" fill="#0284c7" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="318" y1="330" x2="288" y2="305" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round" />

    <!-- Cabeçote do Aparelho de Medição Digital -->
    <rect x="272" y="275" width="34" height="42" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlow)" />
    <!-- Display LCD Digital com Leitura Centesimal -->
    <rect x="276" y="280" width="26" height="16" rx="2" fill="#0284c7" />
    <text x="289" y="292" fill="#ffffff" font-family="monospace" font-size="8" font-weight="900" text-anchor="middle">0.018</text>
    <text x="289" y="309" fill="#38bdf8" font-family="monospace" font-size="5" font-weight="bold" text-anchor="middle">mm ±0.02</text>

    <!-- Ponta Apalpadora de Rubi Tocando a Cavidade do Molde -->
    <line x1="284" y1="317" x2="282" y2="378" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <circle cx="282" cy="378" r="3.5" fill="#ef4444" stroke="#fca5a5" stroke-width="1" />
    <!-- Ponto Laser de Alinhamento Metrológico -->
    <circle cx="282" cy="378" r="7" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="1 2" opacity="0.8" />
  </g>

  <!-- ==================== CABO DE DADOS LIGADO AO NOTEBOOK ==================== -->
  <!-- Cabo USB de Comunicação em Tempo Real do Aparelho até o Notebook -->
  <path d="M306 295 C330 280, 420 285, 470 330 C490 350, 505 340, 520 365" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M306 295 C330 280, 420 285, 470 330 C490 350, 505 340, 520 365" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-dasharray="6 4" />

  <!-- ==================== GRANDE NOTEBOOK COM MEDIÇÕES COLHIDAS ==================== -->
  <g id="laptop_workstation" filter="url(#cardShadow)">
    <!-- Base do Notebook sobre a Mesa -->
    <polygon points="505,370 695,370 705,435 485,435" fill="#334155" stroke="#64748b" stroke-width="2" />
    <!-- Teclado do Notebook -->
    <polygon points="515,375 685,375 693,405 500,405" fill="#1e293b" />
    <!-- Trackpad -->
    <polygon points="575,410 625,410 628,428 572,428" fill="#475569" />

    <!-- Tampa / Tela Aberta Grande (17 Polegadas) -->
    <polygon points="510,210 690,210 695,370 505,370" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <!-- Moldura e Vidro da Tela LCD -->
    <rect x="518" y="218" width="164" height="142" rx="3" fill="url(#screenGrad)" stroke="#0284c7" stroke-width="1.5" />

    <!-- Barra de Título do Software de Metrologia -->
    <rect x="518" y="218" width="164" height="15" fill="#0c4a6e" />
    <circle cx="526" cy="225" r="2.5" fill="#ef4444" />
    <circle cx="533" cy="225" r="2.5" fill="#f59e0b" />
    <circle cx="540" cy="225" r="2.5" fill="#10b981" />
    <text x="600" y="228" fill="#e0f2fe" font-family="sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">METROLOGIA CAD/CAM 3D</text>

    <!-- Visualização 3D da Cavidade do Molde na Tela -->
    <rect x="525" y="238" width="80" height="60" rx="3" fill="#082f49" stroke="#0369a1" stroke-width="1" />
    <!-- Malha 3D Wireframe -->
    <ellipse cx="565" cy="268" rx="24" ry="14" fill="#0284c7" opacity="0.4" />
    <ellipse cx="565" cy="268" rx="16" ry="9" fill="#38bdf8" opacity="0.6" />
    <circle cx="565" cy="268" r="6" fill="#10b981" />
    <text x="565" y="293" fill="#38bdf8" font-family="monospace" font-size="6" font-weight="bold" text-anchor="middle">CAVIDADE-01 [OK]</text>

    <!-- Gráfico de Curva e Tolerância em Tempo Real -->
    <rect x="610" y="238" width="66" height="60" rx="3" fill="#082f49" stroke="#0369a1" stroke-width="1" />
    <!-- Linhas Limite Superior e Inferior (USL / LSL) -->
    <line x1="615" y1="248" x2="670" y2="248" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 1" />
    <line x1="615" y1="288" x2="670" y2="288" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 1" />
    <line x1="615" y1="268" x2="670" y2="268" stroke="#94a3b8" stroke-width="0.8" />
    <!-- Curva de Medição Colhida (Dentro da Faixa Verde) -->
    <path d="M615 272 Q628 262, 642 267 T670 265" fill="none" stroke="#10b981" stroke-width="1.8" filter="url(#neonGlow)" />
    <text x="643" y="244" fill="#f87171" font-family="monospace" font-size="5" text-anchor="middle">USL +0.02</text>
    <text x="643" y="295" fill="#f87171" font-family="monospace" font-size="5" text-anchor="middle">LSL -0.02</text>

    <!-- Tabela de Dados e Telemetria no Rodapé da Tela -->
    <rect x="525" y="303" width="151" height="50" rx="3" fill="#041f38" stroke="#0284c7" stroke-width="0.8" />
    <text x="532" y="315" fill="#38bdf8" font-family="monospace" font-size="6.5" font-weight="bold">COTA NOMINAL: 45,000 mm</text>
    <text x="532" y="326" fill="#a7f3d0" font-family="monospace" font-size="6.5" font-weight="bold">VALOR MEDIDO: 45,018 mm</text>
    <text x="532" y="337" fill="#fde047" font-family="monospace" font-size="6.5" font-weight="bold">DESVIO: +0,018 mm (EM TOLERÂNCIA)</text>

    <!-- Tag Status Aprovado na Tela -->
    <rect x="532" y="342" width="70" height="8" rx="2" fill="#065f46" />
    <text x="567" y="348" fill="#34d399" font-family="sans-serif" font-size="5.5" font-weight="bold" text-anchor="middle">CONFORME PARA INJEÇÃO</text>
  </g>

  <!-- ==================== TÉCNICO DE FERRAMENTARIA ==================== -->
  <g id="technician">
    <!-- Tronco do Técnico em Uniforme Azul Fabril -->
    <path d="M100 320 C100 240, 130 180, 190 170 C240 170, 270 220, 280 300 L240 330 Z" fill="#1e3a8a" stroke="#172554" stroke-width="2" />
    <!-- Faixa Reflexiva de Segurança no Uniforme -->
    <path d="M120 250 Q180 260 250 250" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.8" />

    <!-- Braço Esquerdo Apontando/Segurando com Firmeza -->
    <path d="M170 210 Q210 260 250 290" fill="none" stroke="#1e3a8a" stroke-width="22" stroke-linecap="round" />
    <circle cx="255" cy="295" r="10" fill="#fbcfe8" /> <!-- Mão técnica guiando -->

    <!-- Braço Direito Operando Micrômetro -->
    <path d="M220 210 Q260 230 280 270" fill="none" stroke="#1e3a8a" stroke-width="20" stroke-linecap="round" />
    <circle cx="282" cy="275" r="9" fill="#fbcfe8" />

    <!-- Pescoço e Cabeça -->
    <rect x="180" y="140" width="22" height="25" fill="#fbcfe8" />
    <circle cx="192" cy="118" r="26" fill="#fbcfe8" />
    <!-- Cabelo e Proteção Auricular -->
    <path d="M168 116 C168 95, 216 95, 216 116 C216 102, 172 102, 168 116 Z" fill="#334155" />
    <rect x="166" y="112" width="6" height="14" rx="3" fill="#eab308" /> <!-- Protetor auricular -->

    <!-- Óculos de Proteção Industrial com Lente Ciano -->
    <rect x="185" y="114" width="28" height="11" rx="4" fill="#0284c7" opacity="0.8" stroke="#ffffff" stroke-width="1.2" />
    <line x1="175" y1="117" x2="185" y2="117" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- ==================== OUTRAS FERRAMENTAS DE AJUSTES AO LADO ==================== -->
  <g id="adjustment_tools">
    <!-- Paquímetro Digital em Estojo sobre a Mesa -->
    <g transform="translate(60, 360)">
      <rect x="0" y="0" width="85" height="18" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <!-- Régua do Paquímetro em Aço -->
      <line x1="10" y1="8" x2="80" y2="8" stroke="#cbd5e1" stroke-width="3" />
      <g stroke="#94a3b8" stroke-width="0.8">
        <line x1="15" y1="5" x2="15" y2="11" />
        <line x1="25" y1="5" x2="25" y2="11" />
        <line x1="35" y1="5" x2="35" y2="11" />
        <line x1="45" y1="5" x2="45" y2="11" />
        <line x1="55" y1="5" x2="55" y2="11" />
        <line x1="65" y1="5" x2="65" y2="11" />
        <line x1="75" y1="5" x2="75" y2="11" />
      </g>
      <!-- Bicos e Cursor Digital -->
      <rect x="30" y="3" width="14" height="10" rx="1.5" fill="#3b82f6" />
      <path d="M12 2 L12 14 M30 2 L30 14" stroke="#e2e8f0" stroke-width="1.8" />
    </g>

    <!-- Suporte com Chaves Allen / Hexagonais para Ajuste de Molde -->
    <g transform="translate(65, 395)">
      <rect x="0" y="0" width="70" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <!-- Chaves em formato de 'L' de diferentes calibres -->
      <path d="M8 20 V6 H18" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
      <path d="M22 20 V8 H30" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />
      <path d="M34 20 V10 H41" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <path d="M44 20 V12 H50" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
      <path d="M53 20 V14 H58" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <text x="35" y="22" fill="#64748b" font-family="sans-serif" font-size="4.5" text-anchor="middle">CHAVES ALLEN</text>
    </g>

    <!-- Pedras de Polimento de Diamante (Mold Finishing Stones) -->
    <g transform="translate(70, 435)">
      <!-- Pedra 1 (Grana 600 - Azul) -->
      <polygon points="0,6 45,6 40,14 -5,14" fill="#0284c7" stroke="#38bdf8" stroke-width="0.8" />
      <!-- Pedra 2 (Grana 1200 - Vermelha) -->
      <polygon points="10,16 55,16 50,24 5,24" fill="#dc2626" stroke="#f87171" stroke-width="0.8" />
      <!-- Pasta diamantada de polimento espelhado -->
      <rect x="52" y="10" width="18" height="12" rx="2" fill="#eab308" stroke="#ca8a04" stroke-width="0.8" />
      <text x="61" y="18" fill="#0f172a" font-family="sans-serif" font-size="4" font-weight="bold" text-anchor="middle">PASTA 3μ</text>
    </g>

    <!-- Micrômetro Externo Centesimal (0-25mm) -->
    <g transform="translate(68, 470)">
      <path d="M5 12 C5 2, 35 2, 35 12" fill="none" stroke="#1d4ed8" stroke-width="4.5" stroke-linecap="round" />
      <line x1="2" y1="12" x2="38" y2="12" stroke="#cbd5e1" stroke-width="2" />
      <rect x="35" y="9" width="18" height="6" rx="1.5" fill="#475569" stroke="#94a3b8" stroke-width="0.8" />
      <line x1="53" y1="12" x2="60" y2="12" stroke="#cbd5e1" stroke-width="1.5" />
    </g>
  </g>

  <!-- ==================== BADGES E SELOS FLUTUANTES DE ALTA TECNOLOGIA ==================== -->
  <!-- Badge Superior Esquerdo -->
  <g transform="translate(30, 25)" filter="url(#cardShadow)">
    <rect width="260" height="34" rx="17" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" opacity="0.95" />
    <circle cx="20" cy="17" r="7" fill="#0284c7" />
    <circle cx="20" cy="17" r="3" fill="#38bdf8" />
    <text x="140" y="21" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Inspeção Metrológica Computadorizada</text>
  </g>

  <!-- Badge Inferior Central -->
  <g transform="translate(185, 496)" filter="url(#cardShadow)">
    <rect width="365" height="28" rx="14" fill="#020617" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
    <circle cx="16" cy="14" r="5" fill="#10b981" />
    <text x="190" y="18" fill="#a7f3d0" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Ferramentaria no Local • Manutenção Rápida • Zero Parada de Linha</text>
  </g>
</svg>
